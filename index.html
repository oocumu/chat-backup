<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>대화 백업 에디터</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

  :root{
    --ink:#232B4D;
    --ink-soft:#5A6180;
    --paper:#FAFAF8;
    --panel:#F1F0EC;
    --line:#DEDCD3;
    --accent:#3A3D8F;
    --accent-soft:#E7E7F5;
    --danger:#B23A3A;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--panel);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);}

  .app{display:grid;grid-template-columns:380px 1fr;min-height:100vh;}

  /* ---------- Editor panel ---------- */
  .editor{background:var(--paper);border-right:1px solid var(--line);padding:24px;overflow-y:auto;max-height:100vh;}
  .editor h1{font-size:17px;margin:0 0 4px;letter-spacing:-0.01em;}
  .editor .sub{font-size:12px;color:var(--ink-soft);margin:0 0 20px;}
  .section{margin-bottom:22px;}
  .section-title{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin:10px 0 4px;}
  input[type=text],textarea,select,input[type=number]{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    font-family:inherit;font-size:13px;background:#fff;color:var(--ink);resize:vertical;
  }
  textarea{min-height:44px;}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg button{flex:1;padding:7px 0;border:none;background:#fff;font-size:12px;cursor:pointer;color:var(--ink-soft);}
  .seg button.active{background:var(--accent);color:#fff;}
  .chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);margin-top:8px;}
  .chk input{width:auto;}
  .avatar-pick{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap;}
  .avatar-pick img{width:40px;height:40px;object-fit:cover;background:var(--panel);border:1px solid var(--line);border-radius:50%;}
  .avatar-pick input[type=file]{font-size:11px;max-width:150px;}
  .btn-clear-avatar{border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:7px;padding:5px 9px;font-size:11px;cursor:pointer;}
  .btn-clear-avatar:hover{background:var(--panel);color:var(--danger);}
  .btn{cursor:pointer;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;}
  .btn-primary{background:var(--accent);color:#fff;width:100%;margin-top:14px;}
  .btn-primary:hover{background:#2c2f70;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--accent-soft);color:var(--accent);}

  .list{display:flex;flex-direction:column;gap:6px;}
  .item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:12px;display:flex;align-items:center;gap:8px;}
  .item .tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);flex-shrink:0;}
  .item .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft);}
  .item .actions{display:flex;gap:2px;flex-shrink:0;}
  .item .actions button{background:none;border:none;cursor:pointer;font-size:13px;padding:3px 5px;color:var(--ink-soft);border-radius:4px;}
  .item .actions button:hover{background:var(--panel);color:var(--ink);}
  .empty-hint{font-size:12px;color:var(--ink-soft);text-align:center;padding:14px 0;}

  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .color-field{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff;}
  .color-field input[type=color]{width:26px;height:26px;border:none;padding:0;background:none;}
  .color-field span{font-size:11px;color:var(--ink-soft);}

  /* ---------- Preview panel ---------- */
  .preview-wrap{padding:24px;overflow-y:auto;max-height:100vh;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
  .toolbar .title{font-size:13px;color:var(--ink-soft);}
  .toolbar .actions{display:flex;gap:8px;}
  .btn-export{background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-export:hover{background:#151a34;}
  .btn-export.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);}

  #stage-outer{display:flex;justify-content:center;}
  #stage{background:#ffffff;padding:44px 40px;}

  .msg-row{margin-bottom:26px;}
  .bubble-group{display:flex;align-items:flex-start;gap:10px;}
  .bubble-group.right{flex-direction:row-reverse;}
  .avatar-col{display:flex;flex-direction:column;align-items:center;width:56px;flex-shrink:0;}
  .avatar-col img{width:56px;height:56px;border-radius:50%;object-fit:cover;display:block;}
  .avatar-col .label{font-size:13px;font-weight:700;color:#232B4D;margin-top:6px;}
  .bubble-col{max-width:70%;display:flex;flex-direction:column;}
  .bubble-group.right .bubble-col{align-items:flex-end;}
  .bubble{padding:13px 17px;border-radius:18px;line-height:1.5;}
  .bubble-group.left .bubble{border-top-left-radius:4px;}
  .bubble-group.right .bubble{border-top-right-radius:4px;}
  .bubble .text{font-size:15px;font-weight:500;}
  .narration{font-size:14.5px;line-height:1.85;color:#262626;padding:2px 2px 0;}
  .spacer-top{height:10px;}

  @media (max-width:900px){
    .app{grid-template-columns:1fr;}
    .editor{max-height:none;border-right:none;border-bottom:1px solid var(--line);}
    .preview-wrap{max-height:none;}
  }

  /* ---------- Crop modal ---------- */
  .crop-overlay{position:fixed;inset:0;background:rgba(20,20,30,.55);display:flex;align-items:center;justify-content:center;z-index:50;}
  .crop-box{background:#fff;border-radius:14px;padding:20px;width:320px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .crop-title{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--ink);}
  .crop-viewport{position:relative;width:280px;height:280px;overflow:hidden;border-radius:10px;background:#111;cursor:grab;margin:0 auto;}
  .crop-viewport:active{cursor:grabbing;}
  .crop-viewport img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;}
  .crop-ring{position:absolute;inset:0;pointer-events:none;border:2px dashed rgba(255,255,255,.55);border-radius:10px;}
  .crop-controls{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:var(--ink-soft);}
  .crop-controls input{flex:1;}
  .crop-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .crop-actions .btn-ghost{padding:8px 14px;}
  .crop-actions .btn-export{padding:8px 16px;font-size:13px;}
</style>
</head>
<body>

<div class="app">

  <!-- EDITOR -->
  <div class="editor">
    <h1>대화 백업 에디터</h1>
    <p class="sub">채팅 씬을 만들고 PNG 또는 HTML로 내보내세요.</p>

    <div class="section">
      <div class="section-title">블록 종류</div>
      <div class="seg" id="typeSeg">
        <button data-v="bubble" class="active">대사</button>
        <button data-v="narration">나레이션</button>
      </div>
    </div>

    <div id="bubbleFields">
      <div class="section">
        <div class="section-title">말풍선 방향</div>
        <div class="seg" id="sideSeg">
          <button data-v="left" class="active">왼쪽</button>
          <button data-v="right">오른쪽</button>
        </div>
      </div>

      <label class="chk" style="margin-top:0;"><input type="checkbox" id="showAvatar" checked> 아바타/이름 표시</label>

      <div id="avatarNameFields">
        <label>아바타 이미지</label>
        <div class="avatar-pick">
          <img id="avatarPreview" src="" style="display:none;">
          <input type="file" id="avatarInput" accept="image/*">
          <button type="button" class="btn-clear-avatar" id="cropAgainBtn" style="display:none;">다시 자르기</button>
          <button type="button" class="btn-clear-avatar" id="clearAvatarBtn">이미지 삭제</button>
        </div>
        <div class="seg" id="shapeSeg" style="margin-top:8px;">
          <button data-v="circle" class="active">동그라미</button>
          <button data-v="square">네모</button>
        </div>
        <label>이름</label>
        <input type="text" id="nameInput" placeholder="문구를 입력해 주세요">
      </div>

      <label>텍스트</label>
      <textarea id="textInput" placeholder="문구를 입력해 주세요"></textarea>
    </div>

    <div id="narrationFields" style="display:none;">
      <label>나레이션 본문</label>
      <textarea id="narrationInput" style="min-height:90px;" placeholder="문구를 입력해 주세요"></textarea>
    </div>

    <button class="btn btn-primary" id="addBtn">+ 블록 추가</button>

    <div class="section" style="margin-top:26px;">
      <div class="section-title">블록 목록 (<span id="countLabel">0</span>)</div>
      <div class="list" id="list"></div>
      <div class="empty-hint" id="emptyHint">아직 추가된 블록이 없습니다.</div>
    </div>

    <div class="section">
      <div class="section-title">전체 설정</div>
      <label>채팅 폭 (px)</label>
      <input type="number" id="widthInput" value="760" min="400" max="1400">
      <div class="settings-grid" style="margin-top:10px;">
        <div class="color-field"><input type="color" id="leftColor" value="#1c1c1c"><span>왼쪽 말풍선</span></div>
        <div class="color-field"><input type="color" id="rightColor" value="#111111"><span>오른쪽 말풍선</span></div>
        <div class="color-field"><input type="color" id="leftText" value="#ffffff"><span>왼쪽 글자</span></div>
        <div class="color-field"><input type="color" id="rightText" value="#ffffff"><span>오른쪽 글자</span></div>
      </div>
      <button class="btn btn-ghost" id="resetBtn" style="width:100%;margin-top:16px;">전체 초기화</button>
    </div>
  </div>

  <!-- PREVIEW -->
  <div class="preview-wrap">
    <div class="toolbar">
      <div class="title">미리보기 — 실제 저장 결과와 동일합니다</div>
      <div class="actions">
        <button class="btn-export secondary" id="exportHtml">HTML로 저장</button>
        <button class="btn-export" id="exportPng">PNG로 저장</button>
      </div>
    </div>
    <div id="stage-outer">
      <div id="stage"></div>
    </div>
  </div>

</div>

<!-- CROP MODAL -->
<div id="cropModal" class="crop-overlay" style="display:none;">
  <div class="crop-box">
    <div class="crop-title">아바타 이미지 자르기</div>
    <div id="cropViewport" class="crop-viewport">
      <img id="cropImg" draggable="false">
      <div class="crop-ring" id="cropRing"></div>
    </div>
    <div class="crop-controls">
      <span>확대</span>
      <input type="range" id="cropZoom" min="0" max="100" value="0">
    </div>
    <div class="crop-actions">
      <button class="btn-ghost" id="cropCancel">취소</button>
      <button class="btn-export" id="cropApply">적용</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  let messages = [];
  let blockType = 'bubble';
  let side = 'left';
  let currentAvatar = '';
  let avatarShape = 'circle';
  let lastAvatarLeft = '';
  let lastAvatarRight = '';
  let editingId = null;

  const $ = id => document.getElementById(id);

  // ---- type / side segmented controls ----
  $('typeSeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    blockType = b.dataset.v;
    [...$('typeSeg').children].forEach(x=>x.classList.toggle('active', x===b));
    $('bubbleFields').style.display = blockType==='bubble' ? 'block':'none';
    $('narrationFields').style.display = blockType==='narration' ? 'block':'none';
  });

  $('sideSeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    side = b.dataset.v;
    [...$('sideSeg').children].forEach(x=>x.classList.toggle('active', x===b));
    currentAvatar = side==='left' ? lastAvatarLeft : lastAvatarRight;
    updateAvatarPreview();
  });

  $('showAvatar').addEventListener('change', ()=>{
    $('avatarNameFields').style.display = $('showAvatar').checked ? 'block':'none';
  });

  $('avatarInput').addEventListener('change', e=>{
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{ openCropper(reader.result); };
    reader.readAsDataURL(f);
  });

  $('cropAgainBtn').addEventListener('click', ()=>{
    if(currentAvatar) openCropper(currentAvatar);
  });

  $('shapeSeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    avatarShape = b.dataset.v;
    [...$('shapeSeg').children].forEach(x=>x.classList.toggle('active', x===b));
    updateAvatarPreview();
  });

  $('clearAvatarBtn').addEventListener('click', ()=>{
    currentAvatar = '';
    $('avatarInput').value = '';
    $('cropAgainBtn').style.display = 'none';
    updateAvatarPreview();
  });

  function updateAvatarPreview(){
    const img = $('avatarPreview');
    img.style.borderRadius = avatarShape==='square' ? '10px' : '50%';
    if(currentAvatar){ img.src = currentAvatar; img.style.display='block'; $('cropAgainBtn').style.display='inline-block'; }
    else{ img.style.display='none'; img.src=''; $('cropAgainBtn').style.display='none'; }
  }

  // ---- crop modal ----
  const CROP_SIZE = 280, OUTPUT_SIZE = 400;
  const cropState = {natW:0,natH:0,scale:1,minScale:1,maxScale:1,x:0,y:0,dragging:false,startX:0,startY:0,startPX:0,startPY:0};

  function openCropper(dataUrl){
    const img = new Image();
    img.onload = ()=>{
      cropState.natW = img.naturalWidth; cropState.natH = img.naturalHeight;
      cropState.minScale = Math.max(CROP_SIZE/cropState.natW, CROP_SIZE/cropState.natH);
      cropState.maxScale = cropState.minScale*3;
      cropState.scale = cropState.minScale;
      cropState.x = (CROP_SIZE - cropState.natW*cropState.scale)/2;
      cropState.y = (CROP_SIZE - cropState.natH*cropState.scale)/2;
      $('cropImg').src = dataUrl;
      $('cropZoom').value = 0;
      $('cropRing').style.borderRadius = avatarShape==='square' ? '10px' : '50%';
      applyCropTransform();
      $('cropModal').style.display = 'flex';
    };
    img.src = dataUrl;
  }

  function applyCropTransform(){
    const img = $('cropImg');
    img.style.width = (cropState.natW*cropState.scale)+'px';
    img.style.height = (cropState.natH*cropState.scale)+'px';
    img.style.transform = 'translate('+cropState.x+'px,'+cropState.y+'px)';
  }

  function clampCropPosition(){
    const dispW = cropState.natW*cropState.scale, dispH = cropState.natH*cropState.scale;
    cropState.x = Math.min(0, Math.max(CROP_SIZE-dispW, cropState.x));
    cropState.y = Math.min(0, Math.max(CROP_SIZE-dispH, cropState.y));
  }

  const cropViewport = $('cropViewport');
  cropViewport.addEventListener('pointerdown', e=>{
    cropState.dragging = true;
    cropState.startX = e.clientX; cropState.startY = e.clientY;
    cropState.startPX = cropState.x; cropState.startPY = cropState.y;
    cropViewport.setPointerCapture(e.pointerId);
  });
  cropViewport.addEventListener('pointermove', e=>{
    if(!cropState.dragging) return;
    cropState.x = cropState.startPX + (e.clientX - cropState.startX);
    cropState.y = cropState.startPY + (e.clientY - cropState.startY);
    clampCropPosition();
    applyCropTransform();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>{
    cropViewport.addEventListener(ev, ()=>{ cropState.dragging=false; });
  });

  $('cropZoom').addEventListener('input', ()=>{
    const t = $('cropZoom').value/100;
    const newScale = cropState.minScale + t*(cropState.maxScale-cropState.minScale);
    const cx = (CROP_SIZE/2 - cropState.x)/cropState.scale;
    const cy = (CROP_SIZE/2 - cropState.y)/cropState.scale;
    cropState.scale = newScale;
    cropState.x = CROP_SIZE/2 - cx*newScale;
    cropState.y = CROP_SIZE/2 - cy*newScale;
    clampCropPosition();
    applyCropTransform();
  });

  $('cropCancel').addEventListener('click', ()=>{ $('cropModal').style.display='none'; });

  $('cropApply').addEventListener('click', ()=>{
    const canvas = document.createElement('canvas');
    canvas.width = OUTPUT_SIZE; canvas.height = OUTPUT_SIZE;
    const ctx = canvas.getContext('2d');
    const sx = -cropState.x/cropState.scale, sy = -cropState.y/cropState.scale;
    const sSize = CROP_SIZE/cropState.scale;
    ctx.drawImage($('cropImg'), sx, sy, sSize, sSize, 0, 0, OUTPUT_SIZE, OUTPUT_SIZE);
    currentAvatar = canvas.toDataURL('image/png');
    $('cropModal').style.display = 'none';
    updateAvatarPreview();
  });

  function clearForm(){
    $('textInput').value=''; $('nameInput').value='';
    $('narrationInput').value='';
    currentAvatar = side==='left' ? lastAvatarLeft : lastAvatarRight;
    updateAvatarPreview();
    $('showAvatar').checked = true;
    $('avatarNameFields').style.display='block';
    editingId = null;
    $('addBtn').textContent = '+ 블록 추가';
  }

  $('addBtn').addEventListener('click', ()=>{
    if(blockType==='bubble'){
      const text = $('textInput').value.trim();
      if(!text){ alert('텍스트를 입력해 주세요.'); return; }
      const showAv = $('showAvatar').checked;
      if(currentAvatar){ if(side==='left') lastAvatarLeft=currentAvatar; else lastAvatarRight=currentAvatar; }
      const obj = {
        id: editingId || crypto.randomUUID(), type:'bubble', side,
        avatar: showAv ? currentAvatar : '', name: showAv ? $('nameInput').value.trim() : '',
        shape: avatarShape, text
      };
      upsert(obj);
    } else {
      const text = $('narrationInput').value.trim();
      if(!text){ alert('나레이션 내용을 입력해 주세요.'); return; }
      upsert({ id: editingId || crypto.randomUUID(), type:'narration', text });
    }
    clearForm();
    render();
  });

  function upsert(obj){
    const idx = messages.findIndex(m=>m.id===obj.id);
    if(idx>-1) messages[idx]=obj; else messages.push(obj);
  }

  function editItem(id){
    const m = messages.find(x=>x.id===id); if(!m) return;
    editingId = id;
    if(m.type==='bubble'){
      blockType='bubble'; side=m.side;
      [...$('typeSeg').children].forEach(x=>x.classList.toggle('active', x.dataset.v==='bubble'));
      [...$('sideSeg').children].forEach(x=>x.classList.toggle('active', x.dataset.v===side));
      $('bubbleFields').style.display='block'; $('narrationFields').style.display='none';
      $('textInput').value=m.text;
      $('nameInput').value=m.name||'';
      currentAvatar = m.avatar||''; avatarShape = m.shape||'circle';
      [...$('shapeSeg').children].forEach(x=>x.classList.toggle('active', x.dataset.v===avatarShape));
      updateAvatarPreview();
      $('showAvatar').checked = !!(m.avatar||m.name);
      $('avatarNameFields').style.display = $('showAvatar').checked?'block':'none';
    } else {
      blockType='narration';
      [...$('typeSeg').children].forEach(x=>x.classList.toggle('active', x.dataset.v==='narration'));
      $('bubbleFields').style.display='none'; $('narrationFields').style.display='block';
      $('narrationInput').value=m.text;
    }
    $('addBtn').textContent = '블록 수정 완료';
    window.scrollTo(0,0);
  }

  function removeItem(id){
    messages = messages.filter(m=>m.id!==id);
    if(editingId===id) clearForm();
    render();
  }
  function moveItem(id, dir){
    const i = messages.findIndex(m=>m.id===id);
    const j = i+dir;
    if(j<0 || j>=messages.length) return;
    [messages[i], messages[j]] = [messages[j], messages[i]];
    render();
  }

  $('resetBtn').addEventListener('click', ()=>{
    if(confirm('모든 블록을 삭제할까요?')){ messages=[]; clearForm(); render(); }
  });

  // ---- render editor list + preview stage ----
  function render(){
    const list = $('list');
    list.innerHTML='';
    $('countLabel').textContent = messages.length;
    $('emptyHint').style.display = messages.length? 'none':'block';
    messages.forEach((m,i)=>{
      const row = document.createElement('div'); row.className='item';
      const tag = document.createElement('span'); tag.className='tag';
      tag.textContent = m.type==='bubble' ? (m.side==='left'?'왼쪽':'오른쪽') : '나레이션';
      const txt = document.createElement('span'); txt.className='txt';
      txt.textContent = m.type==='bubble' ? m.text : m.text;
      const actions = document.createElement('div'); actions.className='actions';
      actions.innerHTML = '<button data-a="up" title="위로">↑</button><button data-a="down" title="아래로">↓</button><button data-a="edit" title="수정">✎</button><button data-a="del" title="삭제">✕</button>';
      actions.querySelector('[data-a=up]').onclick=()=>moveItem(m.id,-1);
      actions.querySelector('[data-a=down]').onclick=()=>moveItem(m.id,1);
      actions.querySelector('[data-a=edit]').onclick=()=>editItem(m.id);
      actions.querySelector('[data-a=del]').onclick=()=>removeItem(m.id);
      row.append(tag, txt, actions);
      list.appendChild(row);
    });
    renderStage();
    saveDraft();
  }

  function renderStage(){
    const stage = $('stage');
    const width = parseInt($('widthInput').value)||760;
    stage.style.width = width+'px';
    const lc = $('leftColor').value, rc = $('rightColor').value;
    const lt = $('leftText').value, rt = $('rightText').value;
    stage.innerHTML='';
    messages.forEach(m=>{
      const wrap = document.createElement('div'); wrap.className='msg-row';
      if(m.type==='narration'){
        const p = document.createElement('div'); p.className='narration'; p.textContent=m.text;
        wrap.appendChild(p);
      } else {
        const group = document.createElement('div'); group.className='bubble-group '+m.side;
        if(m.avatar || m.name){
          const col = document.createElement('div'); col.className='avatar-col';
          const radius = m.shape==='square' ? '10px' : '50%';
          if(m.avatar){ const img=document.createElement('img'); img.src=m.avatar; img.style.borderRadius=radius; col.appendChild(img); }
          else { const ph=document.createElement('div'); ph.style.cssText='width:56px;height:56px;background:#eee;border-radius:'+radius+';'; col.appendChild(ph); }
          if(m.name){ const lab=document.createElement('div'); lab.className='label'; lab.textContent=m.name; col.appendChild(lab); }
          group.appendChild(col);
        }
        const bcol = document.createElement('div'); bcol.className='bubble-col';
        const bubble = document.createElement('div'); bubble.className='bubble';
        bubble.style.background = m.side==='left' ? lc : rc;
        bubble.style.color = m.side==='left' ? lt : rt;
        const text = document.createElement('div'); text.className='text'; text.textContent=m.text;
        bubble.appendChild(text);
        bcol.appendChild(bubble);
        group.appendChild(bcol);
        wrap.appendChild(group);
      }
      stage.appendChild(wrap);
    });
  }

  ['widthInput','leftColor','rightColor','leftText','rightText'].forEach(id=>{
    $(id).addEventListener('input', renderStage);
    $(id).addEventListener('change', saveDraft);
  });

  // ---- export ----
  $('exportPng').addEventListener('click', ()=>{
    const stage = $('stage');
    html2canvas(stage, {backgroundColor:'#ffffff', scale:2}).then(canvas=>{
      const link = document.createElement('a');
      link.download = 'chat-backup-'+Date.now()+'.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  });

  $('exportHtml').addEventListener('click', ()=>{
    const styleTag = document.querySelector('style').outerHTML;
    const width = $('widthInput').value;
    const html = '<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>대화 백업</title>'+styleTag+
      '<style>body{background:#fff;} #stage-outer{padding:40px 0;} #stage{margin:0 auto;width:'+width+'px;}</style></head>'+
      '<body><div id="stage-outer"><div id="stage">'+$('stage').innerHTML+'</div></div></body></html>';
    const blob = new Blob([html], {type:'text/html'});
    const link = document.createElement('a');
    link.download = 'chat-backup-'+Date.now()+'.html';
    link.href = URL.createObjectURL(blob);
    link.click();
  });

  // ---- persistence (personal, per-user) ----
  let saveTimer=null;
  function saveDraft(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      try{
        const state = {
          messages,
          width: $('widthInput').value,
          leftColor: $('leftColor').value, rightColor: $('rightColor').value,
          leftText: $('leftText').value, rightText: $('rightText').value
        };
        if(window.storage) await window.storage.set('draft', JSON.stringify(state), false);
      }catch(e){ /* storage unavailable, ignore */ }
    }, 600);
  }
  async function loadDraft(){
    try{
      if(!window.storage) return;
      const res = await window.storage.get('draft', false);
      if(res && res.value){
        const state = JSON.parse(res.value);
        messages = state.messages||[];
        $('widthInput').value = state.width||760;
        $('leftColor').value = state.leftColor||'#1c1c1c';
        $('rightColor').value = state.rightColor||'#111111';
        $('leftText').value = state.leftText||'#ffffff';
        $('rightText').value = state.rightText||'#ffffff';
      }
    }catch(e){ /* no draft yet */ }
    render();
  }

  loadDraft();
})();
</script>
</body>
</html>
