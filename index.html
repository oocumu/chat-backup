<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>대화 백업 에디터</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

  :root{
    --ink:#191F28;
    --ink-soft:#8B95A1;
    --ink-faint:#B0B8C1;
    --paper:#FFFFFF;
    --panel:#F2F4F6;
    --panel-deep:#E8EBEF;
    --line:#E5E8EB;
    --accent:#3182F6;
    --accent-strong:#1B64DA;
    --accent-soft:#EBF2FF;
    --danger:#F04452;
    --danger-soft:#FDECEC;
    --radius:14px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--panel);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);}

  .app{display:grid;grid-template-columns:380px 1fr;min-height:100vh;}

  /* ---------- Editor panel ---------- */
  .editor{background:var(--paper);border-right:1px solid var(--line);padding:32px 26px 44px;overflow-y:auto;max-height:100vh;}
  .editor::-webkit-scrollbar{width:6px;}
  .editor::-webkit-scrollbar-track{background:transparent;}
  .editor::-webkit-scrollbar-thumb{background:var(--panel-deep);border-radius:10px;}
  .editor h1{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;margin:0 0 6px;letter-spacing:-0.02em;}
  .editor h1::before{content:'';width:9px;height:9px;border-radius:3px;background:var(--accent);flex-shrink:0;}
  .editor .sub{font-size:13px;color:var(--ink-soft);margin:0 0 26px;padding-bottom:22px;border-bottom:1px solid var(--line);line-height:1.5;}
  .section{margin-bottom:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 18px;}
  .section-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px;letter-spacing:-0.01em;}
  label{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin:12px 0 6px;}
  input[type=text],textarea,select,input[type=number]{
    width:100%;padding:11px 13px;border:1.5px solid transparent;border-radius:var(--radius-sm);
    font-family:inherit;font-size:13.5px;background:var(--panel);color:var(--ink);resize:vertical;
    transition:border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
  }
  input[type=text]:focus,textarea:focus,select:focus{
    outline:none;background:var(--paper);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);
  }
  textarea{min-height:44px;}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;}
  .seg{display:flex;background:var(--panel);border:none;border-radius:999px;padding:3px;gap:2px;}
  .seg button{flex:1;padding:8px 4px;border:none;background:transparent;border-radius:999px;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);white-space:nowrap;transition:all .15s ease;}
  .seg button:hover:not(.active){color:var(--ink);}
  #sideSeg button{font-size:10.5px;padding:8px 1px;}
  .seg button.active{background:var(--paper);color:var(--accent-strong);box-shadow:0 1px 4px rgba(25,31,40,.10);}
  .chk{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--ink-soft);margin-top:8px;}
  .chk input{width:16px;height:16px;accent-color:var(--accent);}
  #avatarNameWrap,#textFields,#photoFields,#narrationFields{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 18px;margin-top:12px;}
  .avatar-pick{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap;}
  .avatar-pick img{width:40px;height:40px;object-fit:cover;background:var(--panel);border:1px solid var(--line);border-radius:50%;}
  .avatar-pick input[type=file]{font-size:11px;max-width:150px;color:var(--ink-soft);}
  .btn-clear-avatar{border:none;background:var(--panel);color:var(--ink-soft);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s ease;}
  .btn-clear-avatar:hover{background:var(--danger-soft);color:var(--danger);}
  .btn{cursor:pointer;border:none;border-radius:12px;padding:9px 14px;font-size:13px;font-weight:700;}
  .btn-primary{background:var(--accent);color:#fff;width:100%;margin-top:18px;padding:14px;font-size:14px;border-radius:14px;box-shadow:0 8px 20px -8px rgba(49,130,246,.6);transition:all .15s ease;}
  .btn-primary:hover{background:var(--accent-strong);box-shadow:0 10px 22px -8px rgba(27,100,218,.65);transform:translateY(-1px);}
  .btn-primary:active{transform:translateY(0);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
  .btn-ghost:hover{background:var(--accent-soft);color:var(--accent-strong);border-color:var(--accent-soft);}

  .list{display:flex;flex-direction:column;gap:8px;}
  .item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);font-size:12.5px;display:flex;align-items:center;gap:8px;transition:border-color .15s ease;}
  .item:hover{border-color:var(--accent);}
  .item .tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);flex-shrink:0;}
  .item .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
  .item .actions{display:flex;gap:2px;flex-shrink:0;}
  .item .actions button{background:none;border:none;cursor:pointer;font-size:13px;padding:4px 6px;color:var(--ink-soft);border-radius:8px;transition:all .15s ease;}
  .item .actions button:hover{background:var(--accent-soft);color:var(--accent-strong);}
  .empty-hint{font-size:12.5px;color:var(--ink-faint);text-align:center;padding:22px 12px;border:1.5px dashed var(--line);border-radius:12px;background:var(--panel);}

  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .color-field{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:5px 10px;background:var(--panel);}
  .color-field input[type=color]{width:26px;height:26px;border:none;padding:0;background:none;border-radius:8px;overflow:hidden;}
  .color-field span{font-size:11px;color:var(--ink-soft);font-weight:500;}

  /* ---------- Preview panel ---------- */
  .preview-wrap{padding:24px;overflow-y:auto;max-height:100vh;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
  .toolbar .title{font-size:13px;color:var(--ink-soft);}
  .toolbar .actions{display:flex;gap:8px;}
  .btn-export{background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s ease;}
  .btn-export:hover{background:#0E1420;}
  .btn-export.secondary{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);}
  .btn-export.secondary:hover{background:var(--panel);}

  #stage-outer{display:flex;justify-content:center;}
  #stage{background:#ffffff;padding:44px 40px;}

  .msg-row{margin-bottom:26px;}
  .bubble-group{display:flex;align-items:flex-start;gap:10px;}
  .bubble-group.right{flex-direction:row-reverse;}
  .avatar-col{display:flex;flex-direction:column;align-items:center;width:56px;flex-shrink:0;}
  .avatar-col img{width:56px;height:56px;border-radius:50%;object-fit:cover;display:block;}
  .avatar-col .label{font-size:13px;font-weight:700;color:#232B4D;margin-top:6px;}
  .bubble-col{max-width:70%;display:flex;flex-direction:column;}
  .bubble-group.right .bubble-col{align-items:flex-end;}
  .bubble{padding:13px 17px;border-radius:18px;line-height:1.5;}
  .bubble-group.left .bubble{border-top-left-radius:4px;}
  .bubble-group.right .bubble{border-top-right-radius:4px;}
  .bubble .text{font-size:15px;font-weight:500;}
  .photo-msg{max-width:260px;max-height:320px;border-radius:14px;display:block;object-fit:cover;}
  .photo-caption{font-size:13px;color:#4a4a4a;margin-top:6px;}
  .narration{font-size:14.5px;line-height:1.85;color:#262626;padding:2px 2px 0;}
  .center-msg{font-size:15px;font-weight:500;line-height:1.6;color:#262626;text-align:center;padding:2px 2px 0;}
  .spacer-top{height:10px;}

  @media (max-width:900px){
    .app{grid-template-columns:1fr;}
    .editor{max-height:none;border-right:none;border-bottom:1px solid var(--line);}
    .preview-wrap{max-height:none;}
  }

  /* ---------- Crop modal ---------- */
  .crop-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:50;}
  .crop-box{background:var(--paper);border-radius:20px;padding:22px;width:320px;box-shadow:0 24px 60px rgba(15,23,42,.22);}
  .crop-title{font-size:15px;font-weight:800;margin-bottom:14px;color:var(--ink);letter-spacing:-0.01em;}
  .crop-viewport{position:relative;width:280px;height:280px;overflow:hidden;border-radius:16px;background:#111;cursor:grab;margin:0 auto;}
  .crop-viewport:active{cursor:grabbing;}
  .crop-viewport img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;}
  .crop-ring{position:absolute;inset:0;pointer-events:none;border:2px dashed rgba(255,255,255,.55);border-radius:10px;}
  .crop-controls{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:12px;color:var(--ink-soft);}
  .crop-controls input{flex:1;accent-color:var(--accent);}
  .crop-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .crop-actions .btn-ghost{padding:9px 15px;border-radius:12px;}
  .crop-actions .btn-export{padding:9px 17px;font-size:13px;border-radius:12px;}
</style>
</head>
<body>

<div class="app">

  <!-- EDITOR -->
  <div class="editor">
    <h1>대화 백업 에디터</h1>
    <p class="sub">채팅 씬을 만들고 PNG 또는 HTML로 내보내세요.</p>

    <div class="section">
      <div class="section-title">블록 종류</div>
      <div class="seg" id="typeSeg">
        <button data-v="bubble" class="active">대사</button>
        <button data-v="image">사진</button>
        <button data-v="narration">나레이션</button>
      </div>
    </div>

    <div id="speakerFields">
      <div class="section">
        <div class="section-title">말풍선 방향</div>
        <div class="seg" id="sideSeg">
          <button data-v="left" class="active">왼쪽(말풍선)</button>
          <button data-v="right">오른쪽(말풍선)</button>
          <button data-v="center" id="sideCenterBtn">가운데(나레이션)</button>
        </div>
      </div>

      <div id="avatarNameWrap">
        <div class="row" style="margin-top:10px;">
          <label class="chk" style="margin-top:0;"><input type="checkbox" id="showAvatar" checked> 아바타 표시</label>
          <label class="chk" style="margin-top:0;"><input type="checkbox" id="showName" checked> 이름 표시</label>
        </div>

        <div id="avatarNameFields">
          <label>아바타 이미지</label>
          <div class="avatar-pick">
            <img id="avatarPreview" src="" style="display:none;">
            <input type="file" id="avatarInput" accept="image/*">
            <button type="button" class="btn-clear-avatar" id="cropAgainBtn" style="display:none;">다시 자르기</button>
            <button type="button" class="btn-clear-avatar" id="clearAvatarBtn">이미지 삭제</button>
          </div>
          <div class="seg" id="shapeSeg" style="margin-top:8px;">
            <button data-v="circle" class="active">동그라미</button>
            <button data-v="square">네모</button>
          </div>
          <label>이름</label>
          <input type="text" id="nameInput" placeholder="문구를 입력해 주세요">
          <label>이름 색</label>
          <div class="color-field" style="width:fit-content;">
            <input type="color" id="nameColor" value="#232B4D"><span>이름 색상</span>
          </div>
        </div>
      </div>
    </div>

    <div id="textFields">
      <label>텍스트</label>
      <textarea id="textInput" placeholder="문구를 입력해 주세요"></textarea>
    </div>

    <div id="photoFields" style="display:none;">
      <label>사진 모서리</label>
      <div class="seg" id="photoShapeSeg">
        <button data-v="rounded" class="active">둥근 모서리</button>
        <button data-v="square">각진 네모</button>
      </div>
      <label>보낼 사진</label>
      <div class="avatar-pick">
        <img id="photoPreview" src="" style="display:none;width:64px;height:64px;border-radius:8px;">
        <input type="file" id="photoInput" accept="image/*">
        <button type="button" class="btn-clear-avatar" id="clearPhotoBtn">이미지 삭제</button>
      </div>
      <label>캡션 (선택)</label>
      <input type="text" id="captionInput" placeholder="문구를 입력해 주세요">
    </div>

    <div id="narrationFields" style="display:none;">
      <label>정렬</label>
      <div class="seg" id="narAlignSeg">
        <button data-v="left" class="active">왼쪽</button>
        <button data-v="center">가운데</button>
        <button data-v="right">오른쪽</button>
      </div>
      <label class="chk"><input type="checkbox" id="narItalic"> 기울임(이탤릭)</label>
      <label>글자 색</label>
      <div class="color-field" style="width:fit-content;">
        <input type="color" id="narColor" value="#262626"><span>나레이션 색상</span>
      </div>
      <label>나레이션 본문</label>
      <textarea id="narrationInput" style="min-height:90px;" placeholder="문구를 입력해 주세요"></textarea>
    </div>

    <button class="btn btn-primary" id="addBtn">+ 블록 추가</button>

    <div class="section" style="margin-top:26px;">
      <div class="section-title">블록 목록 (<span id="countLabel">0</span>)</div>
      <div class="list" id="list"></div>
      <div class="empty-hint" id="emptyHint">아직 추가된 블록이 없습니다.</div>
    </div>

    <div class="section">
      <div class="section-title">전체 설정</div>
      <label>채팅 폭 (px)</label>
      <input type="number" id="widthInput" value="760" min="400" max="1400">
      <div class="settings-grid" style="margin-top:10px;">
        <div class="color-field"><input type="color" id="leftColor" value="#1c1c1c"><span>왼쪽 말풍선</span></div>
        <div class="color-field"><input type="color" id="rightColor" value="#111111"><span>오른쪽 말풍선</span></div>
        <div class="color-field"><input type="color" id="leftText" value="#ffffff"><span>왼쪽 글자</span></div>
        <div class="color-field"><input type="color" id="rightText" value="#ffffff"><span>오른쪽 글자</span></div>
      </div>
      <button class="btn btn-ghost" id="resetBtn" style="width:100%;margin-top:16px;">전체 초기화</button>
    </div>
  </div>

  <!-- PREVIEW -->
  <div class="preview-wrap">
    <div class="toolbar">
      <div class="title">미리보기 — 실제 저장 결과와 동일합니다</div>
      <div class="actions">
        <button class="btn-export secondary" id="exportHtml">HTML로 저장</button>
        <button class="btn-export" id="exportPng">PNG로 저장</button>
      </div>
    </div>
    <div id="stage-outer">
      <div id="stage"></div>
    </div>
  </div>

</div>

<!-- CROP MODAL -->
<div id="cropModal" class="crop-overlay" style="display:none;">
  <div class="crop-box">
    <div class="crop-title">아바타 이미지 자르기</div>
    <div id="cropViewport" class="crop-viewport">
      <img id="cropImg" draggable="false">
      <div class="crop-ring" id="cropRing"></div>
    </div>
    <div class="crop-controls">
      <span>확대</span>
      <input type="range" id="cropZoom" min="0" max="100" value="0">
    </div>
    <div class="crop-actions">
      <button class="btn-ghost" id="cropCancel">취소</button>
      <button class="btn-export" id="cropApply">적용</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  let messages = [];
  let blockType = 'bubble';
  let side = 'left';
  let currentAvatar = '';
  let currentPhoto = '';
  let photoShape = 'rounded';
  let avatarShape = 'circle';
  let narAlign = 'left';
  let lastAvatarLeft = '';
  let lastAvatarRight = '';
  let editingId = null;

  const $ = id => document.getElementById(id);

  // ---- type / side segmented controls ----
  function updateAvatarNameWrapVisibility(){
    $('avatarNameWrap').style.display = side==='center' ? 'none' : 'block';
  }

  function showFieldsFor(type){
    $('speakerFields').style.display = (type==='bubble' || type==='image') ? 'block':'none';
    $('textFields').style.display = type==='bubble' ? 'block':'none';
    $('photoFields').style.display = type==='image' ? 'block':'none';
    $('narrationFields').style.display = type==='narration' ? 'block':'none';
    $('sideCenterBtn').style.display = type==='image' ? '' : 'none';
    if(type==='bubble' && side==='center'){
      side = 'left';
      [...$('sideSeg').children].forEach(x=>x.classList.toggle('active', x.dataset.v===side));
      currentAvatar = lastAvatarLeft;
      updateAvatarPreview();
    }
    updateAvatarNameWrapVisibility();
  }

  $('typeSeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    blockType = b.dataset.v;
    [...$('typeSeg').children].forEach(x=>x.classList.toggle('active', x===b));
    showFieldsFor(blockType);
  });

  $('photoShapeSeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    photoShape = b.dataset.v;
    [...$('photoShapeSeg').children].forEach(x=>x.classList.toggle('active', x===b));
  });

  $('sideSeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    side = b.dataset.v;
    [...$('sideSeg').children].forEach(x=>x.classList.toggle('active', x===b));
    if(side==='center'){
      currentAvatar = '';
    } else {
      currentAvatar = side==='left' ? lastAvatarLeft : lastAvatarRight;
    }
    updateAvatarPreview();
    updateAvatarNameWrapVisibility();
  });

  $('narAlignSeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    narAlign = b.dataset.v;
    [...$('narAlignSeg').children].forEach(x=>x.classList.toggle('active', x===b));
  });

  $('avatarInput').addEventListener('change', e=>{
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{ openCropper(reader.result); };
    reader.readAsDataURL(f);
  });

  $('cropAgainBtn').addEventListener('click', ()=>{
    if(currentAvatar) openCropper(currentAvatar);
  });

  $('shapeSeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    avatarShape = b.dataset.v;
    [...$('shapeSeg').children].forEach(x=>x.classList.toggle('active', x===b));
    updateAvatarPreview();
  });

  $('clearAvatarBtn').addEventListener('click', ()=>{
    currentAvatar = '';
    $('avatarInput').value = '';
    $('cropAgainBtn').style.display = 'none';
    updateAvatarPreview();
  });

  $('photoInput').addEventListener('change', e=>{
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{ currentPhoto = reader.result; updatePhotoPreview(); };
    reader.readAsDataURL(f);
  });

  $('clearPhotoBtn').addEventListener('click', ()=>{
    currentPhoto = '';
    $('photoInput').value = '';
    updatePhotoPreview();
  });

  function updatePhotoPreview(){
    const img = $('photoPreview');
    if(currentPhoto){ img.src = currentPhoto; img.style.display='block'; }
    else{ img.style.display='none'; img.src=''; }
  }

  function updateAvatarPreview(){
    const img = $('avatarPreview');
    img.style.borderRadius = avatarShape==='square' ? '10px' : '50%';
    if(currentAvatar){ img.src = currentAvatar; img.style.display='block'; $('cropAgainBtn').style.display='inline-block'; }
    else{ img.style.display='none'; img.src=''; $('cropAgainBtn').style.display='none'; }
  }

  // ---- crop modal ----
  const CROP_SIZE = 280, OUTPUT_SIZE = 400;
  const cropState = {natW:0,natH:0,scale:1,minScale:1,maxScale:1,x:0,y:0,dragging:false,startX:0,startY:0,startPX:0,startPY:0};

  function openCropper(dataUrl){
    const img = new Image();
    img.onload = ()=>{
      cropState.natW = img.naturalWidth; cropState.natH = img.naturalHeight;
      cropState.minScale = Math.max(CROP_SIZE/cropState.natW, CROP_SIZE/cropState.natH);
      cropState.maxScale = cropState.minScale*3;
      cropState.scale = cropState.minScale;
      cropState.x = (CROP_SIZE - cropState.natW*cropState.scale)/2;
      cropState.y = (CROP_SIZE - cropState.natH*cropState.scale)/2;
      $('cropImg').src = dataUrl;
      $('cropZoom').value = 0;
      $('cropRing').style.borderRadius = avatarShape==='square' ? '10px' : '50%';
      applyCropTransform();
      $('cropModal').style.display = 'flex';
    };
    img.src = dataUrl;
  }

  function applyCropTransform(){
    const img = $('cropImg');
    img.style.width = (cropState.natW*cropState.scale)+'px';
    img.style.height = (cropState.natH*cropState.scale)+'px';
    img.style.transform = 'translate('+cropState.x+'px,'+cropState.y+'px)';
  }

  function clampCropPosition(){
    const dispW = cropState.natW*cropState.scale, dispH = cropState.natH*cropState.scale;
    cropState.x = Math.min(0, Math.max(CROP_SIZE-dispW, cropState.x));
    cropState.y = Math.min(0, Math.max(CROP_SIZE-dispH, cropState.y));
  }

  const cropViewport = $('cropViewport');
  cropViewport.addEventListener('pointerdown', e=>{
    cropState.dragging = true;
    cropState.startX = e.clientX; cropState.startY = e.clientY;
    cropState.startPX = cropState.x; cropState.startPY = cropState.y;
    cropViewport.setPointerCapture(e.pointerId);
  });
  cropViewport.addEventListener('pointermove', e=>{
    if(!cropState.dragging) return;
    cropState.x = cropState.startPX + (e.clientX - cropState.startX);
    cropState.y = cropState.startPY + (e.clientY - cropState.startY);
    clampCropPosition();
    applyCropTransform();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>{
    cropViewport.addEventListener(ev, ()=>{ cropState.dragging=false; });
  });

  $('cropZoom').addEventListener('input', ()=>{
    const t = $('cropZoom').value/100;
    const newScale = cropState.minScale + t*(cropState.maxScale-cropState.minScale);
    const cx = (CROP_SIZE/2 - cropState.x)/cropState.scale;
    const cy = (CROP_SIZE/2 - cropState.y)/cropState.scale;
    cropState.scale = newScale;
    cropState.x = CROP_SIZE/2 - cx*newScale;
    cropState.y = CROP_SIZE/2 - cy*newScale;
    clampCropPosition();
    applyCropTransform();
  });

  $('cropCancel').addEventListener('click', ()=>{ $('cropModal').style.display='none'; });

  $('cropApply').addEventListener('click', ()=>{
    const canvas = document.createElement('canvas');
    canvas.width = OUTPUT_SIZE; canvas.height = OUTPUT_SIZE;
    const ctx = canvas.getContext('2d');
    const sx = -cropState.x/cropState.scale, sy = -cropState.y/cropState.scale;
    const sSize = CROP_SIZE/cropState.scale;
    ctx.drawImage($('cropImg'), sx, sy, sSize, sSize, 0, 0, OUTPUT_SIZE, OUTPUT_SIZE);
    currentAvatar = canvas.toDataURL('image/png');
    $('cropModal').style.display = 'none';
    updateAvatarPreview();
  });

  function clearForm(){
    $('textInput').value=''; $('nameInput').value='';
    $('narrationInput').value=''; $('captionInput').value='';
    currentAvatar = side==='center' ? '' : (side==='left' ? lastAvatarLeft : lastAvatarRight);
    updateAvatarPreview();
    currentPhoto = '';
    updatePhotoPreview();
    $('photoInput').value = '';
    $('showAvatar').checked = true;
    $('showName').checked = true;
    editingId = null;
    $('addBtn').textContent = '+ 블록 추가';
  }

  $('addBtn').addEventListener('click', ()=>{
    if(blockType==='bubble'){
      const text = $('textInput').value.trim();
      if(!text){ alert('텍스트를 입력해 주세요.'); return; }
      const isCenter = side==='center';
      const showAv = !isCenter && $('showAvatar').checked;
      const showNm = !isCenter && $('showName').checked;
      if(!isCenter && currentAvatar){ if(side==='left') lastAvatarLeft=currentAvatar; else lastAvatarRight=currentAvatar; }
      const obj = {
        id: editingId || crypto.randomUUID(), type:'bubble', side,
        avatar: showAv ? currentAvatar : '', name: showNm ? $('nameInput').value.trim() : '',
        nameColor: $('nameColor').value,
        shape: avatarShape, text
      };
      upsert(obj);
    } else if(blockType==='image'){
      if(!currentPhoto){ alert('보낼 사진을 선택해 주세요.'); return; }
      const isCenter = side==='center';
      const showAv = !isCenter && $('showAvatar').checked;
      const showNm = !isCenter && $('showName').checked;
      if(!isCenter && currentAvatar){ if(side==='left') lastAvatarLeft=currentAvatar; else lastAvatarRight=currentAvatar; }
      const obj = {
        id: editingId || crypto.randomUUID(), type:'image', side,
        avatar: showAv ? currentAvatar : '', name: showNm ? $('nameInput').value.trim() : '',
        nameColor: $('nameColor').value,
        shape: avatarShape, photoShape, photo: currentPhoto, caption: $('captionInput').value.trim()
      };
      upsert(obj);
    } else {
      const text = $('narrationInput').value.trim();
      if(!text){ alert('나레이션 내용을 입력해 주세요.'); return; }
      upsert({ id: editingId || crypto.randomUUID(), type:'narration', text, align:narAlign, italic:$('narItalic').checked, color:$('narColor').value });
    }
    clearForm();
    render();
  });

  function upsert(obj){
    const idx = messages.findIndex(m=>m.id===obj.id);
    if(idx>-1) messages[idx]=obj; else messages.push(obj);
  }

  function loadSpeakerFields(m){
    side = m.side;
    [...$('sideSeg').children].forEach(x=>x.classList.toggle('active', x.dataset.v===side));
    updateAvatarNameWrapVisibility();
    $('nameInput').value=m.name||'';
    $('nameColor').value = m.nameColor || '#232B4D';
    currentAvatar = m.avatar||''; avatarShape = m.shape||'circle';
    [...$('shapeSeg').children].forEach(x=>x.classList.toggle('active', x.dataset.v===avatarShape));
    updateAvatarPreview();
    $('showAvatar').checked = !!m.avatar;
    $('showName').checked = !!m.name;
  }

  function editItem(id){
    const m = messages.find(x=>x.id===id); if(!m) return;
    editingId = id;
    blockType = m.type;
    if(m.type==='image'){
      photoShape = m.photoShape||'rounded';
      [...$('photoShapeSeg').children].forEach(x=>x.classList.toggle('active', x.dataset.v===photoShape));
    }
    [...$('typeSeg').children].forEach(x=>x.classList.toggle('active', x.dataset.v===blockType));
    showFieldsFor(blockType);
    if(m.type==='bubble'){
      loadSpeakerFields(m);
      $('textInput').value=m.text;
    } else if(m.type==='image'){
      loadSpeakerFields(m);
      currentPhoto = m.photo||'';
      updatePhotoPreview();
      $('captionInput').value = m.caption||'';
    } else {
      $('narrationInput').value=m.text;
      narAlign = m.align||'left';
      [...$('narAlignSeg').children].forEach(x=>x.classList.toggle('active', x.dataset.v===narAlign));
      $('narItalic').checked = !!m.italic;
      $('narColor').value = m.color || '#262626';
    }
    $('addBtn').textContent = '블록 수정 완료';
    window.scrollTo(0,0);
  }

  function removeItem(id){
    messages = messages.filter(m=>m.id!==id);
    if(editingId===id) clearForm();
    render();
  }
  function moveItem(id, dir){
    const i = messages.findIndex(m=>m.id===id);
    const j = i+dir;
    if(j<0 || j>=messages.length) return;
    [messages[i], messages[j]] = [messages[j], messages[i]];
    render();
  }

  $('resetBtn').addEventListener('click', ()=>{
    if(confirm('모든 블록을 삭제할까요?')){ messages=[]; clearForm(); render(); }
  });

  // ---- render editor list + preview stage ----
  function render(){
    const list = $('list');
    list.innerHTML='';
    $('countLabel').textContent = messages.length;
    $('emptyHint').style.display = messages.length? 'none':'block';
    messages.forEach((m,i)=>{
      const row = document.createElement('div'); row.className='item';
      const tag = document.createElement('span'); tag.className='tag';
      const sideLabel = m.side==='left' ? '왼쪽' : (m.side==='right' ? '오른쪽' : '가운데');
      tag.textContent = m.type==='narration' ? '나레이션' : (m.type==='image' ? '사진 · '+sideLabel : sideLabel);
      const txt = document.createElement('span'); txt.className='txt';
      txt.textContent = m.type==='image' ? (m.caption || '(캡션 없음)') : m.text;
      const actions = document.createElement('div'); actions.className='actions';
      actions.innerHTML = '<button data-a="up" title="위로">↑</button><button data-a="down" title="아래로">↓</button><button data-a="edit" title="수정">✎</button><button data-a="del" title="삭제">✕</button>';
      actions.querySelector('[data-a=up]').onclick=()=>moveItem(m.id,-1);
      actions.querySelector('[data-a=down]').onclick=()=>moveItem(m.id,1);
      actions.querySelector('[data-a=edit]').onclick=()=>editItem(m.id);
      actions.querySelector('[data-a=del]').onclick=()=>removeItem(m.id);
      row.append(tag, txt, actions);
      list.appendChild(row);
    });
    renderStage();
    saveDraft();
  }

  function buildAvatarCol(m){
    const col = document.createElement('div'); col.className='avatar-col';
    const radius = m.shape==='square' ? '10px' : '50%';
    if(m.avatar){ const img=document.createElement('img'); img.src=m.avatar; img.style.borderRadius=radius; col.appendChild(img); }
    else { const ph=document.createElement('div'); ph.style.cssText='width:56px;height:56px;background:#eee;border-radius:'+radius+';'; col.appendChild(ph); }
    if(m.name){ const lab=document.createElement('div'); lab.className='label'; lab.textContent=m.name; lab.style.color = m.nameColor || '#232B4D'; col.appendChild(lab); }
    return col;
  }

  function renderStage(){
    const stage = $('stage');
    const width = parseInt($('widthInput').value)||760;
    stage.style.width = width+'px';
    const lc = $('leftColor').value, rc = $('rightColor').value;
    const lt = $('leftText').value, rt = $('rightText').value;
    stage.innerHTML='';
    messages.forEach(m=>{
      const wrap = document.createElement('div'); wrap.className='msg-row';
      if(m.type==='narration'){
        const p = document.createElement('div'); p.className='narration'; p.textContent=m.text;
        p.style.textAlign = m.align || 'left';
        p.style.color = m.color || '#262626';
        if(m.italic) p.style.fontStyle = 'italic';
        wrap.appendChild(p);
      } else if(m.type==='image'){
        const photoRadius = m.photoShape==='square' ? '0px' : '14px';
        if(m.side==='center'){
          const box = document.createElement('div'); box.style.cssText='display:flex;flex-direction:column;align-items:center;';
          const photo = document.createElement('img'); photo.src = m.photo; photo.className='photo-msg'; photo.style.borderRadius = photoRadius;
          box.appendChild(photo);
          if(m.caption){ const cap=document.createElement('div'); cap.className='photo-caption'; cap.style.textAlign='center'; cap.textContent=m.caption; box.appendChild(cap); }
          wrap.appendChild(box);
        } else {
          const group = document.createElement('div'); group.className='bubble-group '+m.side;
          if(m.avatar || m.name) group.appendChild(buildAvatarCol(m));
          const bcol = document.createElement('div'); bcol.className='bubble-col';
          const photo = document.createElement('img'); photo.src = m.photo; photo.className='photo-msg'; photo.style.borderRadius = photoRadius;
          bcol.appendChild(photo);
          if(m.caption){ const cap=document.createElement('div'); cap.className='photo-caption'; cap.textContent=m.caption; bcol.appendChild(cap); }
          group.appendChild(bcol);
          wrap.appendChild(group);
        }
      } else {
        if(m.side==='center'){
          const p = document.createElement('div'); p.className='center-msg'; p.textContent=m.text;
          wrap.appendChild(p);
        } else {
          const group = document.createElement('div'); group.className='bubble-group '+m.side;
          if(m.avatar || m.name) group.appendChild(buildAvatarCol(m));
          const bcol = document.createElement('div'); bcol.className='bubble-col';
          const bubble = document.createElement('div'); bubble.className='bubble';
          bubble.style.background = m.side==='left' ? lc : rc;
          bubble.style.color = m.side==='left' ? lt : rt;
          const text = document.createElement('div'); text.className='text'; text.textContent=m.text;
          bubble.appendChild(text);
          bcol.appendChild(bubble);
          group.appendChild(bcol);
          wrap.appendChild(group);
        }
      }
      stage.appendChild(wrap);
    });
  }

  ['widthInput','leftColor','rightColor','leftText','rightText'].forEach(id=>{
    $(id).addEventListener('input', renderStage);
    $(id).addEventListener('change', saveDraft);
  });

  // ---- export ----
  $('exportPng').addEventListener('click', ()=>{
    const stage = $('stage');
    html2canvas(stage, {backgroundColor:'#ffffff', scale:2}).then(canvas=>{
      const link = document.createElement('a');
      link.download = 'chat-backup-'+Date.now()+'.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  });

  $('exportHtml').addEventListener('click', ()=>{
    const styleTag = document.querySelector('style').outerHTML;
    const width = $('widthInput').value;
    const html = '<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>대화 백업</title>'+styleTag+
      '<style>body{background:#fff;} #stage-outer{padding:40px 0;} #stage{margin:0 auto;width:'+width+'px;}</style></head>'+
      '<body><div id="stage-outer"><div id="stage">'+$('stage').innerHTML+'</div></div></body></html>';
    const blob = new Blob([html], {type:'text/html'});
    const link = document.createElement('a');
    link.download = 'chat-backup-'+Date.now()+'.html';
    link.href = URL.createObjectURL(blob);
    link.click();
  });

  // ---- persistence (personal, per-user) ----
  let saveTimer=null;
  function saveDraft(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      try{
        const state = {
          messages,
          width: $('widthInput').value,
          leftColor: $('leftColor').value, rightColor: $('rightColor').value,
          leftText: $('leftText').value, rightText: $('rightText').value
        };
        if(window.storage) await window.storage.set('draft', JSON.stringify(state), false);
      }catch(e){ /* storage unavailable, ignore */ }
    }, 600);
  }
  async function loadDraft(){
    try{
      if(!window.storage) return;
      const res = await window.storage.get('draft', false);
      if(res && res.value){
        const state = JSON.parse(res.value);
        messages = state.messages||[];
        $('widthInput').value = state.width||760;
        $('leftColor').value = state.leftColor||'#1c1c1c';
        $('rightColor').value = state.rightColor||'#111111';
        $('leftText').value = state.leftText||'#ffffff';
        $('rightText').value = state.rightText||'#ffffff';
      }
    }catch(e){ /* no draft yet */ }
    render();
  }

  loadDraft();
})();
</script>
</body>
</html>
